{{- include "soma.validateNetworking" . -}}
{{- if .Values.httpRoute.enabled -}}
{{- if not (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1") -}}
{{- fail "httpRoute.enabled requires the Gateway API v1 CRD (gateway.networking.k8s.io/v1). Install the Gateway API or use ingress.enabled instead." -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "soma.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soma.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- range .Values.httpRoute.parentRefs }}
    - name: {{ .name }}
      {{- if .namespace }}
      namespace: {{ .namespace }}
      {{- end }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    - matches:
        {{- toYaml .matches | nindent 8 }}
      backendRefs:
        - name: {{ include "soma.fullname" $ }}
          port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
