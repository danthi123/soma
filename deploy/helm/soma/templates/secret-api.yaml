{{- if and .Values.api.enabled (not .Values.api.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "soma.apiSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soma.labels" . | nindent 4 }}
  annotations:
    # Survive `helm uninstall` so upgrades and re-installs don't rotate
    # the API key out from under every caller. Delete manually with
    # `kubectl delete secret <name>` if you actually want it gone.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  {{ include "soma.apiSecretKey" . }}: {{ include "soma.apiKey" . | quote }}
{{- end }}
