app = "soma-memory"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SOMA_EMBED_MODEL = "all-MiniLM-L6-v2"
  SOMA_BUNDLE_PATH = "/data/memory"
  SOMA_BUNDLES_DIR = "/data/bundles"
  # Auth — uncomment these to run with JWT verification. The SECRET
  # itself MUST be set via `fly secrets set SOMA_JWT_SECRET=$(openssl
  # rand -hex 32)` — secrets do NOT belong in the committed toml.
  # Without any SOMA_JWT_SECRET / SOMA_API_KEY configured, every
  # endpoint is unauthenticated (Open mode). See docs/auth.md.
  # SOMA_JWT_ALG = "HS256"
  # SOMA_JWT_LEEWAY = "60"

[[mounts]]
  source = "soma_data"
  destination = "/data"

[http_service]
  internal_port = 8420
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048

[[http_service.checks]]
  path = "/health"
