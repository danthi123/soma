[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soma"
version = "0.1.0"
description = "Self-Organizing Memory Architecture — A brain-inspired developmental AI system"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "tokenizers>=0.15.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]
multimodal = [
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",
]
data = [
    "datasets>=2.14.0",
]
viz = [
    "matplotlib>=3.7.0",
    "networkx>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (integration tests, deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
