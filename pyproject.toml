[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soma-memory"
version = "0.2.0rc2"
description = "Local-first, learning agent-memory layer — a plastic graph that grows and prunes with use, a drop-in for vector-DB-plus-RAG."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Daniel Thiberge", email = "daniel.thiberge@gmail.com"},
]
keywords = [
    "memory", "rag", "agent", "llm", "vector-search", "embeddings",
    "local-first", "retrieval", "semantic-search", "agent-memory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "tokenizers>=0.15.0",
    "PyYAML>=6.0",
    "portalocker>=2.8",
]

[project.urls]
Homepage = "https://github.com/danthi123/soma"
Repository = "https://github.com/danthi123/soma"
Documentation = "https://github.com/danthi123/soma/blob/main/docs/quickstart.md"
Changelog = "https://github.com/danthi123/soma/blob/main/CHANGELOG.md"
Issues = "https://github.com/danthi123/soma/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0",
]
multimodal = [
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",
]
data = [
    "datasets>=2.14.0",
]
viz = [
    "matplotlib>=3.7.0",
    "networkx>=3.1",
]
ui = [
    "dearpygui>=1.10.0",
    "matplotlib>=3.7.0",
    "networkx>=3.1",
]
dev-chat = [
    "transformers>=4.40",
    "accelerate>=0.30",
    "safetensors>=0.4",
]
quant = [
    # bitsandbytes provides int4/int8 weight quantization for HF causal LMs.
    # Kept as an optional extra (NOT a hard dep) because Windows wheels have
    # historically been flaky and CI/dev should not break when bnb is missing.
    # See `docs/deployment.md` "Quantization (optional)" for usage.
    "bitsandbytes>=0.43.0",
]
gguf = [
    # llama-cpp-python lets SOMA's inference-only path consume local GGUF
    # files (e.g., from LM Studio cache). Optional extra -- NOT a hard dep
    # because the wheel build is environment-sensitive. Training paths are
    # unaffected; GGUF cannot be used for verbalizer gradient flow.
    "llama-cpp-python>=0.2.70",
]
sbert = [
    "sentence-transformers>=2.2.0",
]
serve = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "sentence-transformers>=2.2.0",
    # Phase 4 JWT auth — PyJWT with the `crypto` extra pulls in
    # `cryptography` for RS256 (HS256 works without it). Pin to >=2.8
    # for the 2024 algorithm-confusion hardening.
    "pyjwt[crypto]>=2.8",
]
ann = [
    "faiss-cpu>=1.7.0",
]
qdrant = [
    # QdrantBackend adapter — optional extra. Without this, SOMA runs on
    # the default InProcBackend (FAISS + numpy) which needs no extra
    # setup. Install with `pip install soma[qdrant]` to unlock the HTTP
    # scale path and local-file mode. See docs/backends.md.
    "qdrant-client>=1.10",
]
qdrant-test = [
    # Cross-version snapshot/restore compatibility tests for
    # QdrantBackend. Spins up real Qdrant containers (1.11/1.12/1.13)
    # via testcontainers-python and exercises snapshot export +
    # restore between versions. Gated behind
    # `SOMA_QDRANT_VERSION_MATRIX=1` and the `slow_qdrant` pytest
    # marker so the default test run stays fast and Docker-free.
    # See docs/backends.md "Cross-version snapshot testing".
    "testcontainers>=4",
    "qdrant-client>=1.10",
]
lancedb = [
    # LanceDBBackend adapter — optional extra. Fills the "local-first
    # scale past Qdrant-local's 20K cap, no server" niche between
    # InProc (RAM-bound) and Qdrant HTTP (requires infra). Arrow-native,
    # columnar, fully embedded; a LanceDB table IS a directory on disk,
    # which composes with SOMA's bundle layout. Install with
    # `pip install soma[lancedb]`. See docs/backends.md.
    "lancedb>=0.11",
]
chroma = [
    # ChromaBackend adapter — optional extra. Drop-in replacement for
    # existing Chroma users: point MemoryLayer at an existing
    # chromadb PersistentClient directory and SOMA's memory layer
    # composes on top (ids/texts/metadata/WAL stay in SOMA; vectors
    # stay in Chroma). Install with `pip install soma[chroma]`. See
    # docs/backends.md. Floor pinned to 0.5 because the
    # delete_collection + recreate semantics and the removal of the
    # explicit ``persist()`` method landed in 0.5 — supporting the
    # 0.4.x API would require an adapter-side version switch.
    "chromadb>=0.5",
]
pgvector = [
    # PgvectorBackend adapter — optional extra. Covers the
    # "we already run Postgres; don't give us another database to
    # operate" slot: point MemoryLayer at a pgvector-enabled Postgres
    # (managed RDS / Cloud SQL / Supabase, or a self-hosted cluster)
    # and SOMA's memory layer composes on top. psycopg v3 driver —
    # async-ready, much faster than v2. pgvector>=0.3 introduced the
    # ``vector(n)`` type alongside the legacy array form. Install with
    # `pip install soma[pgvector]`. See docs/backends.md.
    "psycopg[binary]>=3",
    "pgvector>=0.3",
]
s3 = [
    # S3ObjectStore adapter — optional extra. Without this, SOMA's bundle
    # storage runs on the default LocalFSObjectStore (filesystem only).
    # Install with `pip install soma[s3]` to unlock ``s3://bucket/prefix``
    # URLs on ``MemoryLayer.save``/``load`` and any S3-compatible endpoint
    # (MinIO, Cloudflare R2, DigitalOcean Spaces) via ``endpoint_url=``.
    # See docs/backends.md.
    "boto3>=1.34",
]
s3-test = [
    # Unit tests for S3ObjectStore use moto's in-memory S3 mock. Fast,
    # deterministic, always-on (no Docker, no network). ``moto>=5``
    # renamed the context manager from ``mock_s3`` to ``mock_aws``; we
    # pin to that major so the adapter's tests don't silently drift.
    "moto[s3]>=5",
]
gcs = [
    # GCSObjectStore adapter — optional extra. Without this, SOMA's bundle
    # storage runs on the default LocalFSObjectStore (filesystem only).
    # Install with `pip install soma[gcs]` to unlock ``gs://bucket/prefix``
    # URLs on ``MemoryLayer.save``/``load``. Credentials follow the standard
    # Google Application Default Credentials chain
    # (``GOOGLE_APPLICATION_CREDENTIALS``, metadata server on GCP,
    # ``gcloud auth application-default login`` for local dev).
    # See docs/backends.md.
    "google-cloud-storage>=2.10",
]
gcs-test = [
    # Unit tests for GCSObjectStore use the community
    # ``gcp-storage-emulator`` (in-process HTTP server speaking the real
    # GCS JSON API). ``google-cloud-storage`` honours the
    # ``STORAGE_EMULATOR_HOST`` env var transparently, so the same
    # adapter code paths run against the emulator without any
    # sub-classing. Higher fidelity than raw ``unittest.mock`` stubs.
    "gcp-storage-emulator>=2024.8",
]
pgvector-test = [
    # Integration tests for PgvectorBackend spin up a real
    # pgvector/pgvector:pg16 container via testcontainers-python and
    # exercise the full adapter surface against live SQL. Gated behind
    # `SOMA_PGVECTOR_INTEGRATION=1` and the `slow_pgvector` pytest
    # marker so the default test run stays fast and Docker-free.
    # Mirrors the qdrant-test extra. See docs/backends.md.
    "testcontainers>=4",
    "psycopg[binary]>=3",
    "pgvector>=0.3",
]
langchain = [
    "langchain-core>=0.1.0",
]
llamaindex = [
    "llama-index-core>=0.10.0",
]
metrics = [
    # Prometheus instrumentation. Kept as an optional extra so the core
    # `serve` path runs without observability deps. Install with
    # `pip install soma[metrics]` to enable the /metrics endpoint and
    # soma_* counters/histograms in soma.metrics.
    "prometheus-fastapi-instrumentator>=7.1",
    "prometheus-client>=0.20",
]
redis-revocation = [
    # Optional RedisBlocklist backend for multi-host / k8s deploys
    # where the default file-backed JSONL store's 30 s poll lag is
    # unacceptable. Instant cross-worker propagation via Redis, with
    # automatic TTL equal to the token's `exp` claim. Install with
    # `pip install soma[redis-revocation]`. See docs/auth.md.
    "redis>=5.0",
]
otel = [
    # OpenTelemetry tracing — opt-in via SOMA_OTEL_ENABLED=1. The FastAPI
    # instrumentor + OTel SDK pull ~5 transitive packages, so we keep
    # them strictly optional. The OTLP exporter lets spans flow to
    # Jaeger / Tempo / Datadog via the standard OTEL_EXPORTER_OTLP_*
    # env vars; no in-code config needed.
    "opentelemetry-instrumentation-fastapi>=0.50",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp>=1.30",
]
bench = [
    # Everything the benchmark harnesses need: dev (pytest + ruff +
    # mypy), metrics (prometheus), ann (faiss-cpu), sbert
    # (sentence-transformers), plus chromadb as a direct competitor
    # in run_scale_vs_chroma + run_backend_matrix. Keeps CI install
    # lines short: `pip install -e ".[bench]"`.
    "soma[dev,metrics,ann,sbert]",
    "chromadb>=0.5",
]

[project.scripts]
soma = "soma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (integration tests, deselect with '-m \"not slow\"')",
    "cuda: requires a CUDA GPU to run (deselect with '-m \"not cuda\"')",
    "quant: requires bitsandbytes and CUDA for weight quantization tests",
    "slow_qdrant: cross-version Qdrant snapshot/restore tests via testcontainers (Phase 24); gated by SOMA_QDRANT_VERSION_MATRIX=1",
    "slow_pgvector: pgvector integration tests via testcontainers (Phase 29); gated by SOMA_PGVECTOR_INTEGRATION=1",
    "slow_s3: real S3 / S3-compatible integration tests (Phase 31); gated by SOMA_S3_INTEGRATION_BUCKET=<bucket>",
    "slow_gcs: real GCS integration tests (Phase 32); gated by SOMA_GCS_INTEGRATION_BUCKET=<bucket>",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["tokenizers", "tokenizers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "networkx", "networkx.*",
    "matplotlib", "matplotlib.*",
    "torchaudio", "torchaudio.*",
    "dearpygui", "dearpygui.*",
    "transformers", "transformers.*",
    "accelerate", "accelerate.*",
    "safetensors", "safetensors.*",
    "bitsandbytes", "bitsandbytes.*",
    "llama_cpp", "llama_cpp.*",
    "sentence_transformers", "sentence_transformers.*",
    "langchain_core", "langchain_core.*",
    "llama_index", "llama_index.*",
    "fastapi", "fastapi.*",
    "uvicorn", "uvicorn.*",
    "faiss", "faiss.*",
    "qdrant_client", "qdrant_client.*",
    "lancedb", "lancedb.*",
    "chromadb", "chromadb.*",
    "psycopg", "psycopg.*",
    "pgvector", "pgvector.*",
    "pyarrow", "pyarrow.*",
    "redis", "redis.*",
    "fakeredis", "fakeredis.*",
    "google", "google.*",
    "gcp_storage_emulator", "gcp_storage_emulator.*",
]
ignore_missing_imports = true
