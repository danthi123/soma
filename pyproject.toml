[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soma"
version = "0.1.0"
description = "Self-Organizing Memory Architecture — A brain-inspired developmental AI system"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "tokenizers>=0.15.0",
    "PyYAML>=6.0",
    "portalocker>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0",
]
multimodal = [
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",
]
data = [
    "datasets>=2.14.0",
]
viz = [
    "matplotlib>=3.7.0",
    "networkx>=3.1",
]
ui = [
    "dearpygui>=1.10.0",
    "matplotlib>=3.7.0",
    "networkx>=3.1",
]
dev-chat = [
    "transformers>=4.40",
    "accelerate>=0.30",
    "safetensors>=0.4",
]
quant = [
    # bitsandbytes provides int4/int8 weight quantization for HF causal LMs.
    # Kept as an optional extra (NOT a hard dep) because Windows wheels have
    # historically been flaky and CI/dev should not break when bnb is missing.
    # See `docs/deployment.md` "Quantization (optional)" for usage.
    "bitsandbytes>=0.43.0",
]
gguf = [
    # llama-cpp-python lets SOMA's inference-only path consume local GGUF
    # files (e.g., from LM Studio cache). Optional extra -- NOT a hard dep
    # because the wheel build is environment-sensitive. Training paths are
    # unaffected; GGUF cannot be used for verbalizer gradient flow.
    "llama-cpp-python>=0.2.70",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (integration tests, deselect with '-m \"not slow\"')",
    "cuda: requires a CUDA GPU to run (deselect with '-m \"not cuda\"')",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["tokenizers", "tokenizers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "networkx", "networkx.*",
    "matplotlib", "matplotlib.*",
    "torchaudio", "torchaudio.*",
    "dearpygui", "dearpygui.*",
    "transformers", "transformers.*",
    "accelerate", "accelerate.*",
    "safetensors", "safetensors.*",
    "bitsandbytes", "bitsandbytes.*",
    "llama_cpp", "llama_cpp.*",
]
ignore_missing_imports = true
