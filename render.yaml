services:
  - type: web
    name: soma-memory
    runtime: docker
    plan: standard
    healthCheckPath: /health
    envVars:
      # JWT (recommended). Render mints a random 32-byte secret on
      # first apply. Mint per-caller tokens with `soma auth issue`
      # from a clone of the repo after the deploy is live.
      - key: SOMA_JWT_SECRET
        generateValue: true
      - key: SOMA_EMBED_MODEL
        value: all-MiniLM-L6-v2
    disk:
      name: soma-data
      mountPath: /app/data
      sizeGB: 1
